<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Violence Detection</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #eef2ff, #f8fafc);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
        color: #1f2937;
      }

      .container {
        width: 100%;
        max-width: 1200px;
        background: #ffffff;
        border-radius: 22px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        padding: 32px;
      }

      .header {
        text-align: center;
        margin-bottom: 28px;
      }

      .header h1 {
        font-size: 34px;
        color: #111827;
        margin-bottom: 10px;
      }

      .header p {
        color: #6b7280;
        font-size: 15px;
      }

      .upload-section {
        background: #f8fafc;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 20px;
        margin-bottom: 24px;
      }

      .upload-form {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        align-items: center;
      }

      input[type="file"] {
        border: 1px solid #d1d5db;
        background: white;
        padding: 10px 12px;
        border-radius: 10px;
        cursor: pointer;
      }

      .btn {
        border: none;
        outline: none;
        padding: 12px 20px;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        opacity: 0.95;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      .btn-upload {
        background: #2563eb;
        color: white;
      }

      .btn-preview {
        background: #0ea5e9;
        color: white;
      }

      .btn-submit {
        background: #ef4444;
        color: white;
      }

      .btn-camera {
        background: #10b981;
        color: white;
      }

      .button-container {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 28px;
      }

      .video-wrapper {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
      }

      .video-card {
        background: #f9fafb;
        border: 1px solid #e5e7eb;
        border-radius: 18px;
        padding: 16px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      }

      .video-card h3 {
        font-size: 18px;
        margin-bottom: 14px;
        color: #111827;
      }

      .media-box {
        width: 100%;
        height: 360px;
        background: #e5e7eb;
        border-radius: 14px;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
      }

      video,
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: black;
        border-radius: 12px;
      }

      .status-box {
        margin-top: 22px;
        text-align: center;
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        color: #1d4ed8;
        padding: 14px;
        border-radius: 14px;
        font-size: 15px;
        font-weight: 600;
      }

      @media (max-width: 900px) {
        .video-wrapper {
          grid-template-columns: 1fr;
        }

        .media-box {
          height: 300px;
        }
      }

      @media (max-width: 600px) {
        .container {
          padding: 20px;
        }

        .header h1 {
          font-size: 28px;
        }

        .media-box {
          height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Violence Detection</h1>
        <p>Upload video, preview content, process prediction, or open live camera</p>
      </div>

      <div class="upload-section">
        <form class="upload-form" action="/uploader" method="POST" enctype="multipart/form-data">
          <input type="file" name="file" id="file-input" />
          <input class="btn btn-upload" type="submit" value="Upload" />
        </form>
      </div>

      <div class="button-container">
        <button class="btn btn-preview" id="preview-button" disabled>Preview</button>
        <button class="btn btn-submit" id="submit-button" disabled>Submit</button>
        <button class="btn btn-camera" id="camera-button">Open Camera</button>
      </div>

      <div class="video-wrapper">
        <div class="video-card">
          <h3>Original Preview</h3>
          <div class="media-box">
            <video id="preview-video" controls></video>
          </div>
        </div>

        <div class="video-card">
          <h3>Processed Output</h3>
          <div class="media-box">
            <img id="processed-video" src="" alt="Processed video stream" />
          </div>
        </div>
      </div>

      <div class="status-box" id="status-text">
        Waiting for upload...
      </div>
    </div>

    <script>
      let filename;
      const statusText = document.getElementById("status-text");

      document
        .querySelector(".upload-form")
        .addEventListener("submit", function (event) {
          event.preventDefault();
          const formData = new FormData(event.target);

          statusText.textContent = "Uploading video...";

          fetch("/uploader", {
            method: "POST",
            body: formData,
          })
            .then(function (response) {
              return response.text();
            })
            .then(function (responseFilename) {
              filename = responseFilename;
              document.getElementById("preview-button").disabled = false;
              document.getElementById("submit-button").disabled = false;
              statusText.textContent = "Upload successful: " + filename;
            })
            .catch(function () {
              statusText.textContent = "Upload failed.";
            });
        });

      document
        .getElementById("preview-button")
        .addEventListener("click", function () {
          if (!filename) return;
          document.getElementById("preview-video").src =
            "/static/uploads/" + filename;
          statusText.textContent = "Previewing video: " + filename;
        });

      document
        .getElementById("submit-button")
        .addEventListener("click", function () {
          if (!filename) return;

          statusText.textContent = "Processing uploaded video...";

          fetch("/start_processing", {
            method: "POST",
            body: JSON.stringify({ filename: filename }),
            headers: {
              "Content-Type": "application/json",
            },
          }).then(function () {
            document.getElementById("processed-video").src =
              "/processed_video_feed/" + filename;
            statusText.textContent = "Prediction stream started.";
          });
        });

      document
        .getElementById("camera-button")
        .addEventListener("click", function () {
          statusText.textContent = "Opening live camera...";

          fetch("/start_processing", {
            method: "POST",
            body: JSON.stringify({ filename: "camera" }),
            headers: {
              "Content-Type": "application/json",
            },
          }).then(function () {
            document.getElementById("processed-video").src = "/camera_feed";
            statusText.textContent = "Live camera stream started.";
          });
        });
    </script>
  </body>
</html>
